<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <!-- Outer Map Grid lines (subtle) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
  <line x1="256" y1="56" x2="256" y2="456" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Code brackets / Compass geometric icon -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Central Hexagon / Node network -->
    <polygon points="0,-100 86,-50 86,50 0,100 -86,50 -86,-50" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Code Bracket Left < -->
    <path d="M-45,-40 L-95,0 L-45,40" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Code Bracket Right > -->
    <path d="M45,-40 L95,0 L45,40" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- North Compass Needle / Core Tree Node -->
    <polygon points="0,-75 22,0 0,-15 -22,0" fill="#38bdf8" />
    <polygon points="0,75 22,0 0,15 -22,0" fill="#64748b" />

    <!-- Center Core Spark -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" filter="url(#glow)" />
    <circle cx="0" cy="0" r="7" fill="#0284c7" />

    <!-- Satellite interconnected graph nodes -->
    <circle cx="-86" cy="-50" r="8" fill="#38bdf8" />
    <circle cx="86" cy="-50" r="8" fill="#38bdf8" />
    <circle cx="86" cy="50" r="8" fill="#38bdf8" />
    <circle cx="-86" cy="50" r="8" fill="#38bdf8" />
    <circle cx="0" cy="-100" r="10" fill="#60a5fa" />
    <circle cx="0" cy="100" r="10" fill="#60a5fa" />
  </g>

  <!-- Title Badge / Subtitle visual -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#94a3b8" letter-spacing="4" text-anchor="middle">CODEATLAS</text>
</svg>
