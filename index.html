    <script>
      (function() {
        try {
          var saved = localStorage.getItem('codeatlas_theme') || 'system';
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}

        // Intercept console.error to filter out harmless Vite HMR WebSocket error in AI Studio preview
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var isViteWsError = args.some(function(arg) {
            var str = String(arg && (arg.message || arg.stack || arg) || '');
            return str.includes('WebSocket closed without opened') || (str.includes('[vite]') && str.includes('WebSocket'));
          });
          if (isViteWsError) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        // Intercept WebSocket for vite-hmr to prevent failed connection attempt
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          function PatchedWebSocket(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && url.includes('vite'))) {
              var listeners = {};
              var ws = {
                readyState: 1,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                url: url,
                protocol: protocols || '',
                addEventListener: function(type, cb) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(cb);
                  if (type === 'open') {
                    setTimeout(function() {
                      cb({ type: 'open' });
                    }, 0);
                  }
                },
                removeEventListener: function(type, cb) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(fn) { return fn !== cb; });
                  }
                },
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {
                  ws.readyState = 3;
                }
              };
              return ws;
            }
            return new RealWebSocket(url, protocols);
          }
          PatchedWebSocket.prototype = RealWebSocket.prototype;
          PatchedWebSocket.CONNECTING = 0;
          PatchedWebSocket.OPEN = 1;
          PatchedWebSocket.CLOSING = 2;
          PatchedWebSocket.CLOSED = 3;
          window.WebSocket = PatchedWebSocket;
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#090D16] text-slate-900 dark:text-slate-100 antialiased selection:bg-indigo-100 dark:selection:bg-indigo-950 selection:text-indigo-900 dark:selection:text-indigo-200 min-h-screen transition-colors duration-150">
